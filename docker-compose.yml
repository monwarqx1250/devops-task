# Pulls in the observability stack (Prometheus, Grafana, Loki, Alloy,
# Node Exporter, cAdvisor). Paths inside it resolve relative to monitoring/.
include:
  - monitoring/docker-compose.yaml

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8080:3000"
    environment:
      PORT: "3000"
      LOG_LEVEL: "info"
      ENVIRONMENT: "local"
      APP_VERSION: "1.0.0"
      # Set FAULT_INJECTION=true to enable GET /simulate/error (demo only).
      FAULT_INJECTION: ${FAULT_INJECTION:-false}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
