apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-task

labels:
  - pairs:
      app.kubernetes.io/part-of: devops-task
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

# Generated names get a content hash, so changing config or secrets triggers a rollout.
configMapGenerator:
  - name: app-config
    literals:
      - PORT=3000
      - LOG_LEVEL=info
      - ENVIRONMENT=k8s-local

# Secret values live in k8s/secret.env, which is git-ignored.
#   cp k8s/secret.env.example k8s/secret.env   # then edit the values
secretGenerator:
  - name: app-secrets
    envs:
      - secret.env

images:
  - name: devops-task
    newTag: 1.0.0
