apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  # k3d/k3s ships Traefik. On EKS this becomes "alb" (AWS Load Balancer Controller).
  ingressClassName: traefik
  rules:
    - host: devops-task.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
